[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dicast"
version = "1.0.0"
description = "Confidence scoring for structural-variant calls from short-read sequencing"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
# Kept in sync with environment.yml; all of these ship prebuilt wheels on
# PyPI for Linux/macOS, so `pip install git+...` works without conda.
dependencies = [
    "numpy",
    "pandas",
    "xgboost>=1.7,<3",
    "scikit-learn",  # xgboost's XGBClassifier wrapper requires it
    "pysam",
    "pyBigWig",
    "bioframe",
    "vcfpy",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "joblib",
    "packaging",
    "networkx",
]

[project.urls]
Repository = "https://github.com/burgshrimps/dicast"

[project.scripts]
dicast = "dicast.cli:main"
dicast-fetch-annotations = "dicast.annotations:fetch_main"

[tool.setuptools]
packages = ["dicast"]

[tool.setuptools.package-data]
dicast = ["models/*.json"]
