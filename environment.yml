name: dicast
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy
  - pandas
  - xgboost>=1.7,<3
  - pysam
  - pyBigWig
  - bioframe
  - vcfpy
  - matplotlib
  - pyyaml
  - tqdm
  - joblib
  - packaging
  - networkx
  - pip
  # Installs the `dicast` command into the env (editable, so the repo's
  # annot/ and models/ defaults keep working). Run `conda env create` from
  # the repo root.
  - pip:
      - -e .
