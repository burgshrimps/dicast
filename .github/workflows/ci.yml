name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install dicast and test-only dependencies
        shell: bash -el {0}
        # The editable install re-runs even on a cached env, so the dicast
        # entry point always matches the checked-out code.
        run: |
          pip install -e .
          pip install -r tests/requirements-test.txt

      - name: Import-check every dicast module
        shell: bash -el {0}
        run: |
          python3 -c "
          import dicast.cli
          import dicast.annotations
          import dicast.parsing
          import dicast.prepare
          import dicast.collect_illumina
          import dicast.collect_reference
          import dicast.model
          import dicast.multi
          import dicast.merge
          import dicast.utils
          print('dicast: all modules imported OK')
          "

      - name: CLI help sanity checks
        shell: bash -el {0}
        run: |
          dicast --help
          dicast call --help
          dicast multi --help

      - name: Run test suite
        shell: bash -el {0}
        run: python3 -m pytest tests/ -q

      - name: Demo end-to-end run
        shell: bash -el {0}
        run: |
          dicast call \
            --sample demo \
            --workdir demo_out \
            --fai tests/data/hg38.fa.fai \
            --bam tests/data/demo.bam \
            --vcfs delly=tests/data/demo_delly.vcf.gz \
            --annot-dir tests/data/annot \
            --chrom chr21 \
            --sv_types DEL INS \
            --threads 2

      - name: Check demo output
        shell: bash -el {0}
        run: |
          test -f demo_out/output/demo_hg38.SVs.dicast.tsv
          rows=$(($(wc -l < demo_out/output/demo_hg38.SVs.dicast.tsv) - 1))
          echo "Data rows: $rows"
          if [ "$rows" -ne 20 ]; then
            echo "Expected 20 data rows, got $rows"
            exit 1
          fi

          test -f demo_out/output/demo_hg38.SVs.dicast.merged.vcf
          merged_records=$(grep -vc '^#' demo_out/output/demo_hg38.SVs.dicast.merged.vcf)
          echo "Merged VCF records: $merged_records"
          if [ "$merged_records" -lt 1 ]; then
            echo "Expected at least 1 merged VCF record, got $merged_records"
            exit 1
          fi
